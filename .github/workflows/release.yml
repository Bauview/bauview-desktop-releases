# Baut den Windows-Installer und veröffentlicht ihn als GitHub-Release (für den automatischen Updater der App).
# Auslöser: neue Version in package.json auf main, oder manuell (Actions → Release → Run workflow).
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Release zuerst als Entwurf anlegen (verhindert den Wettlauf zweier Uploads, die je ein Release anlegen wollen)
      - name: Release-Entwurf vorbereiten
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          gh release delete "v$VER" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" --draft --target "$GITHUB_SHA" --title "$VER" --notes "BauView $VER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Installer bauen und hochladen
        shell: bash
        run: npx electron-builder --win --publish always -c.publish.releaseType=draft 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release veröffentlichen
        shell: bash
        run: |
          gh release view "v$VER" --json assets -q '.assets[].name' | tee -a build.log
          gh release view "v$VER" --json assets -q '.assets[].name' | grep -q latest.yml
          gh release edit "v$VER" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Protokoll bei Fehler sichern (Branch ci-log)
        if: failure()
        shell: bash
        run: |
          git config user.name "BauView CI"; git config user.email "ci@bauview.invalid"
          git checkout --orphan ci-log; git rm -rf --cached . >/dev/null; git add -f build.log; git commit -m "Build-Protokoll $GITHUB_RUN_ID"; git push -f origin ci-log
